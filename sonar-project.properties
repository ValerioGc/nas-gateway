sonar.projectKey=nas-gateway
sonar.projectName=Nas Gateway
sonar.projectVersion=0.9.3

sonar.sources=src,scripts,system
sonar.tests=tests
sonar.exclusions=**/target/**,**/coverage/**,**/release-assets/**
