[package]
name = "nas-os-gateway"
version = "0.9.0"
edition = "2021"

[dependencies]
axum = "0.8"
hyper = { version = "1.12.0", features = ["http1", "client"] }
hyper-util = { version = "0.1.20", default-features = false, features = ["tokio"] }
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["full"] }
sqlx = { version = "0.9", default-features = false, features = ["sqlite", "runtime-tokio", "migrate", "macros"] }
argon2 = "0.6"
sha2 = "0.11.0"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
rcgen = { version = "0.14", default-features = false, features = ["ring", "pem", "crypto", "x509-parser"] }
p12-keystore = "0.4"
x509-parser = "0.18"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
